services:
  - type: web
    name: discover-mahdia
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: PUBLIC_APP_URL
        value: https://discover-mahdia.com
      - key: CLIENT_ORIGIN
        value: https://discover-mahdia.com
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: discover-mahdia-db
          property: connectionString

databases:
  - name: discover-mahdia-db
    plan: 0.1c-256mb
